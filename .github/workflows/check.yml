name: Check Code

env:
  CARGO_TERM_COLOR: always
  RUST_CACHE_SHARED_KEY: rust-webrtc

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      runtime: ${{ steps.changes.outputs.runtime }}
      terraform: ${{ steps.changes.outputs.terraform }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: |
          rust:
            - '**/*.rs'
            - '**/Cargo.toml'
            - '**/Cargo.lock'
            - '.github/workflows/**'
            - 'Makefile'
          runtime:
            - '**/*.rs'
            - '**/Cargo.toml'
            - '**/Cargo.lock'
            - 'Dockerfile'
            - '.dockerignore'
            - 'dist/**'
          terraform:
            - 'terraform_*/**'
            - '.github/workflows/**'

  fmt:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: rustfmt
    - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
    - run: cargo binstall -y --force cargo-tomlfmt@0.2.1
    - run: cargo fmt --all -- --check
    - run: |
        set -euo pipefail
        find . -name Cargo.toml.new -delete
        trap 'find . -name Cargo.toml.new -delete' EXIT
        find . -name Cargo.toml -print0 | while IFS= read -r -d '' manifest; do
          (cd "$(dirname "$manifest")" && cargo tomlfmt -d)
        done

  clippy:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ env.RUST_CACHE_SHARED_KEY }}
    - run: cargo clippy --all-targets --all-features -- -Dwarnings

  test:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ env.RUST_CACHE_SHARED_KEY }}
    - run: cargo test

  runtime-image:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build runtime image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        tags: webrtc-runtime-smoke:pr
        cache-from: type=gha,scope=runtime-image
        cache-to: type=gha,mode=max,scope=runtime-image
    - name: Smoke test runtime server boot
      run: |
        set -euo pipefail
        container_id="$(
          docker run -d --rm \
            -e HOST_ADDR=0.0.0.0:8080 \
            -e GITHUB_CLIENT_ID=dummy \
            -e GITHUB_CLIENT_SECRET=dummy \
            -e REDIRECT_URL='http://127.0.0.1:18080/oauth/callback' \
            -p 18080:8080 \
            webrtc-runtime-smoke:pr
        )"
        trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
        for _ in {1..30}; do
          curl -fsS http://127.0.0.1:18080/version >/dev/null && exit 0
          sleep 1
        done
        exit 1
    # I1: without CA roots the GitHub API client cannot be built and sign-in fails.
    - name: Check CA bundle is readable by the runtime user
      run: |
        set -euo pipefail
        docker run --rm --entrypoint /bin/sh webrtc-runtime-smoke:pr -c \
          'test -n "$SSL_CERT_FILE" && test -r "$SSL_CERT_FILE" && test "$(grep -c "BEGIN CERTIFICATE" "$SSL_CERT_FILE")" -gt 100'
    - name: Smoke test OAuth callback reaches GitHub
      run: |
        set -euo pipefail
        container_id="$(
          docker run -d --rm \
            -e HOST_ADDR=0.0.0.0:8080 \
            -e GITHUB_CLIENT_ID=dummy \
            -e GITHUB_CLIENT_SECRET=dummy \
            -e REDIRECT_URL='http://127.0.0.1:18080/oauth/callback' \
            -p 18080:8080 \
            webrtc-runtime-smoke:pr
        )"
        trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
        for _ in {1..30}; do
          curl -fsS http://127.0.0.1:18080/version >/dev/null && break
          sleep 1
        done
        headers="$(curl -sS -D - -o /dev/null -X POST -H 'Sec-Fetch-Site: same-origin' http://127.0.0.1:18080/login | tr -d '\r')"
        cookie="$(sed -nE 's/^[Ss]et-[Cc]ookie: (__Host-login=[^;]+);.*/\1/p' <<<"$headers")"
        state="$(sed -nE 's/^[Ll]ocation: .*[?&]state=([^&]+).*/\1/p' <<<"$headers")"
        # Both HTTP clients are built before the token exchange, so a fake code
        # gets 401 from GitHub only when TLS setup works; a missing CA bundle is 500.
        status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Cookie: ${cookie}" \
          "http://127.0.0.1:18080/oauth/callback?code=ci-fake-code&state=${state}")"
        echo "callback status: ${status}"
        test "${status}" = 401

  e2e-tests:
    needs: [changes, runtime-image]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
    - name: Verify runtime smoke test result
      run: |
        set -euo pipefail
        if [[ "${{ needs.changes.outputs.runtime }}" == "true" && "${{ needs.runtime-image.result }}" != "success" ]]; then
          echo "runtime-image job did not pass"
          exit 1
        fi
        echo "No separate e2e suite is configured; runtime smoke test gate is satisfied."

  terraform-check:
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.15.5
        terraform_wrapper: false
    - name: Terraform Init
      run: |
        terraform -chdir=terraform_bootstrap/bootstrap init -backend=false
        terraform -chdir=terraform_gcp_storage init -backend=false
        terraform -chdir=terraform_gcp_app init -backend=false
        terraform -chdir=terraform_gcp_edge init -backend=false
        terraform -chdir=terraform_bootstrap init -backend=false
        terraform -chdir=terraform_cf init -backend=false
    - name: Terraform Validate
      run: |
        terraform -chdir=terraform_bootstrap/bootstrap validate
        terraform -chdir=terraform_gcp_storage validate
        terraform -chdir=terraform_gcp_app validate
        terraform -chdir=terraform_gcp_edge validate
        terraform -chdir=terraform_bootstrap validate
        terraform -chdir=terraform_cf validate
    - name: Terraform Format Check
      run: |
        terraform -chdir=terraform_bootstrap/bootstrap fmt -check
        terraform -chdir=terraform_gcp_storage fmt -recursive -check
        terraform -chdir=terraform_gcp_app fmt -check
        terraform -chdir=terraform_gcp_edge fmt -check
        terraform -chdir=terraform_bootstrap fmt -check
        terraform -chdir=terraform_cf fmt -check
    - name: Write Terraform Validation Summary
      run: |
        set -euo pipefail
        cat > terraform-plan.txt <<'EOF'
        Terraform validation completed without cloud credentials.

        This PR workflow intentionally uses `terraform init -backend=false`,
        `terraform validate`, and `terraform fmt -check` only. Cloud-backed
        Terraform plan/apply runs are reserved for the trusted main deploy
        workflow after merge.
        EOF
    - name: Post Terraform Validation to PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('./terraform-plan.txt', 'utf8');
          const output = `## Terraform Validation Results

          <details>
          <summary>Validation Output</summary>

          \`\`\`
          ${plan}
          \`\`\`

          </details>

          *Pusher: @${process.env.ACTOR}, Action: \`${process.env.EVENT_NAME}\`*
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });
